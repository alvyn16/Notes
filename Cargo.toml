[package]
name = "notes-windows"
version = "0.2.0"
edition = "2024"
description = "Notes: a native Rust and egui Markdown app for Windows"
license = "GPL-3.0-only"

[[bin]]
name = "notes"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "persistence", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15.4"
ignore = "0.4"
chrono = "0.4"
pulldown-cmark = "0.13"
regex = "1"
notify = "8.2"
getrandom = "0.3"
ureq = { version = "3.4", features = ["json"] }
sha2 = "0.10"
egui_extras = { version = "0.33.3", default-features = false, features = ["svg_text", "image", "file", "http"] }
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
trash = "5.2.9"
latex-rust = "2.1.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
